<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibi Makeup | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">Bibi <span>Makeup.</span></div>

        <nav>
            <a href="index.html">Início</a>
            <a href="produto.html">Produtos</a>
            <a href="login.html">Entrar</a>
            <a href="new.html">Cadastrar</a>
        </nav>
    </header>

    <main>

        <section class="area-formulario">

            <form class="formulario" action="#" method="get">

                <h1>Bem-vinda de volta!</h1>

                <p>Entre na sua conta da Bibi Makeup.</p>

                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit" class="botao">Entrar</button>

                <div class="link-form">
                    <p>Ainda não possui uma conta?</p>
                    <a href="new.html">Cadastre-se aqui!</a>
                </div>

            </form>

        </section>

    </main>

    <footer>
        <p><strong>Bibi Makeup</strong> - Sua beleza, seu jeito!</p>
        <p>© 2026 Bibi Makeup. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
