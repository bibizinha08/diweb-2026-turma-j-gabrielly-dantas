<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Exemplo 01 - Box Model</title>
    <style>
        body {
            background-color: rgb(237, 165, 207);
            color: rgb(255, 255, 255);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 22px;

            margin-top: 20px;
            margin-right: 30px;
            margin-bottom: 20px;
            margin-left: 30px;
        }

        strong,
        code {
            color: rgb(152, 39, 218);
            font-weight: 600;
        }

        .title {
            font-size: 50px;

            margin: 10px 0;

            border: 3px solid rgb(255, 255, 255);
            padding: 15px;
        }

        .box {
            width: 80%;
            height: auto;

            padding: 20px;
            
            border: 2px dashed rgb(255, 255, 255);
            
            margin-top: 25px;
            margin-right: auto;
            margin-bottom: 25px;
            margin-left: auto;

            background-color: rgb(238, 134, 188);
        }

        .banner {
            width: 100%;
            height: auto;
            
            margin: 15px 0;
            border: 4px solid rgb(255, 248, 143);
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1 class="title">Trabalhando com imagens externas</h1>
    
    <div class="box">
        <p>
            Para utilizarmos imagens externas devemos atribuir ao atributo <strong>src</strong> da tag
            <code>&lt;img&gt;</code>
        </p>
    </div>

    <img src="cachorro.PNG" alt="Banner cachorro" title="Banner de cachorro" class="banner">
</body>
</html>
